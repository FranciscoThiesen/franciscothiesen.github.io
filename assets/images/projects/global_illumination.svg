<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <defs>
    <linearGradient id="backW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3efe2"/>
      <stop offset="100%" stop-color="#cfc8b4"/>
    </linearGradient>
    <linearGradient id="leftW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8e2415"/>
      <stop offset="100%" stop-color="#d8442e"/>
    </linearGradient>
    <linearGradient id="rightW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2fae5d"/>
      <stop offset="100%" stop-color="#15703a"/>
    </linearGradient>
    <linearGradient id="ceilW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6cfba"/>
      <stop offset="100%" stop-color="#efe9da"/>
    </linearGradient>
    <linearGradient id="floorW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ded6c2"/>
      <stop offset="100%" stop-color="#9a9078"/>
    </linearGradient>
    <radialGradient id="mirr" cx="0.35" cy="0.32">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cfcfcf"/>
      <stop offset="70%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#2e2e2e"/>
    </radialGradient>
    <radialGradient id="wsph" cx="0.38" cy="0.3">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#efe9d8"/>
      <stop offset="100%" stop-color="#b3a98e"/>
    </radialGradient>
    <radialGradient id="lglow">
      <stop offset="0%" stop-color="#fffbe6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fffbe6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- the box -->
  <rect x="150" y="110" width="180" height="140" fill="url(#backW)"/>
  <polygon points="0,0 480,0 330,110 150,110" fill="url(#ceilW)"/>
  <polygon points="0,360 480,360 330,250 150,250" fill="url(#floorW)"/>
  <polygon points="0,0 150,110 150,250 0,360" fill="url(#leftW)"/>
  <polygon points="480,0 330,110 330,250 480,360" fill="url(#rightW)"/>

  <!-- area light + bloom -->
  <ellipse cx="240" cy="90" rx="100" ry="46" fill="url(#lglow)"/>
  <polygon points="198,46 282,46 270,72 210,72" fill="#fffdf2"/>
  <ellipse cx="240" cy="296" rx="120" ry="28" fill="#fffbe6" opacity="0.14"/>

  <!-- color bleed on near walls -->
  <polygon points="150,110 330,110 330,250 150,250" fill="#d8442e" opacity="0.05"/>

  <!-- soft shadows -->
  <ellipse cx="198" cy="301" rx="52" ry="11" fill="#241d12" opacity="0.32"/>
  <ellipse cx="196" cy="300" rx="34" ry="8"  fill="#241d12" opacity="0.38"/>
  <ellipse cx="306" cy="279" rx="42" ry="9"  fill="#241d12" opacity="0.3"/>
  <ellipse cx="304" cy="278" rx="27" ry="6.5" fill="#241d12" opacity="0.35"/>

  <!-- mirror sphere (reflecting the red and green walls) -->
  <circle cx="192" cy="252" r="44" fill="url(#mirr)"/>
  <ellipse cx="158" cy="254" rx="10" ry="28" fill="#d8442e" opacity="0.45"/>
  <ellipse cx="226" cy="254" rx="9" ry="26" fill="#2fae5d" opacity="0.4"/>
  <ellipse cx="192" cy="289" rx="24" ry="6" fill="#6b6250" opacity="0.5"/>
  <circle cx="181" cy="234" r="6" fill="#ffffff" opacity="0.95"/>

  <!-- diffuse sphere with subtle bleed -->
  <circle cx="300" cy="240" r="34" fill="url(#wsph)"/>
  <ellipse cx="283" cy="242" rx="10" ry="24" fill="#d8442e" opacity="0.2"/>
  <ellipse cx="317" cy="242" rx="10" ry="24" fill="#2fae5d" opacity="0.22"/>
  <ellipse cx="295" cy="222" rx="12" ry="6" fill="#ffffff" opacity="0.7"/>
</svg>
