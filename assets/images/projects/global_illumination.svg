<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <radialGradient id="gMirror" cx="0.35" cy="0.3">
      <stop offset="0%" stop-color="#ececec"/>
      <stop offset="45%" stop-color="#9a9a9a"/>
      <stop offset="100%" stop-color="#2e2e2e"/>
    </radialGradient>
    <radialGradient id="gOrange" cx="0.35" cy="0.3">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="55%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <radialGradient id="gGlow">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="360" rx="10" fill="#0d0d0d"/>
  <path d="M10 0.5 h460 a9.5 9.5 0 0 1 9.5 9.5 v26 h-479 v-26 a9.5 9.5 0 0 1 9.5 -9.5 z" fill="#141414"/>
  <line x1="0" y1="36" x2="480" y2="36" stroke="#1f1f1f"/>
  <circle cx="22" cy="18" r="5" fill="#f87171"/>
  <circle cx="42" cy="18" r="5" fill="#fbbf24"/>
  <circle cx="62" cy="18" r="5" fill="#4ade80"/>
  <text x="82" y="22.5" font-size="12.5" fill="#6b6b6b">$ pathtracer cornell.scn</text>

  <!-- cornell box -->
  <rect x="180" y="120" width="120" height="130" fill="#191919"/>
  <polygon points="110,70 370,70 300,120 180,120" fill="#1d1d1d"/>
  <polygon points="110,300 370,300 300,250 180,250" fill="#202020"/>
  <polygon points="110,70 180,120 180,250 110,300" fill="#f87171" opacity="0.3"/>
  <polygon points="370,70 300,120 300,250 370,300" fill="#4ade80" opacity="0.28"/>

  <!-- area light + glow -->
  <ellipse cx="240" cy="116" rx="62" ry="28" fill="url(#gGlow)" opacity="0.4"/>
  <polygon points="222,103 258,103 248,88 232,88" fill="#fde68a"/>
  <ellipse cx="240" cy="278" rx="66" ry="12" fill="#fbbf24" opacity="0.07"/>

  <!-- spheres + soft shadows -->
  <ellipse cx="193" cy="291" rx="34" ry="7" fill="#000000" opacity="0.55"/>
  <ellipse cx="305" cy="277" rx="28" ry="6" fill="#000000" opacity="0.5"/>
  <circle cx="193" cy="254" r="33" fill="url(#gMirror)"/>
  <circle cx="305" cy="246" r="27" fill="url(#gOrange)"/>

  <!-- bounced light paths -->
  <polyline points="240,100 207,225 300,168" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.75"/>
  <polyline points="246,100 303,222 368,262" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>

  <text x="240" y="330" font-size="12.5" fill="#737373" text-anchor="middle">explicit light sampling · 8 → 25,000 spp</text>

  <rect x="0.5" y="0.5" width="479" height="359" rx="9.5" fill="none" stroke="#262626"/>
</svg>
