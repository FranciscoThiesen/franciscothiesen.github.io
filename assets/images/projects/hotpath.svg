<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <marker id="ahv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/>
    </marker>
  </defs>
  <rect width="480" height="360" rx="10" fill="#0d0d0d"/>
  <path d="M10 0.5 h460 a9.5 9.5 0 0 1 9.5 9.5 v26 h-479 v-26 a9.5 9.5 0 0 1 9.5 -9.5 z" fill="#141414"/>
  <line x1="0" y1="36" x2="480" y2="36" stroke="#1f1f1f"/>
  <circle cx="22" cy="18" r="5" fill="#f87171"/>
  <circle cx="42" cy="18" r="5" fill="#fbbf24"/>
  <circle cx="62" cy="18" r="5" fill="#4ade80"/>
  <text x="82" y="22.5" font-size="12.5" fill="#6b6b6b">$ hotpath app.py</text>

  <!-- flame graph -->
  <text x="196" y="150" font-size="12.5" fill="#fb923c" text-anchor="middle" font-weight="700">simulate() — 82%</text>
  <rect x="148" y="160" width="96" height="24" fill="#f97316" fill-opacity="0.95"/>
  <rect x="134" y="186" width="120" height="24" fill="#f97316" fill-opacity="0.55"/>
  <rect x="36" y="212" width="92" height="24" fill="#f97316" fill-opacity="0.3"/>
  <rect x="134" y="212" width="142" height="24" fill="#f97316" fill-opacity="0.42"/>
  <rect x="36" y="238" width="240" height="24" fill="#f97316" fill-opacity="0.2"/>
  <text x="44" y="254" font-size="11.5" fill="#a3a3a3">main()</text>
  <text x="142" y="228" font-size="11.5" fill="#bfbfbf">step()</text>
  <text x="142" y="202" font-size="11.5" fill="#d4d4d4">update()</text>

  <!-- python -> c++ via LLM -->
  <rect x="320" y="128" width="124" height="38" rx="6" fill="#141414" stroke="#22d3ee"/>
  <text x="382" y="152" font-size="14" fill="#22d3ee" text-anchor="middle">app.py</text>
  <path d="M382 170 V 204" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#ahv)"/>
  <text x="394" y="192" font-size="11.5" fill="#c084fc">LLM</text>
  <rect x="320" y="210" width="124" height="38" rx="6" fill="#141414" stroke="#f97316"/>
  <text x="382" y="234" font-size="14" fill="#f97316" text-anchor="middle">kernel.cpp</text>

  <!-- caption -->
  <text x="240" y="318" font-size="13" fill="#737373" text-anchor="middle">profile → score → transpile → verify</text>
  <text x="240" y="340" font-size="11" fill="#525252" text-anchor="middle">generated tests on both sides of the boundary</text>

  <rect x="0.5" y="0.5" width="479" height="359" rx="9.5" fill="none" stroke="#262626"/>
</svg>
