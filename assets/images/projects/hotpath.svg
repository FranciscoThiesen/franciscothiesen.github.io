<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#160803"/>
      <stop offset="100%" stop-color="#360c02"/>
    </linearGradient>
    <linearGradient id="hotbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="heat">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </radialGradient>
    <marker id="ext" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fda4af"/>
    </marker>
  </defs>

  <rect width="480" height="360" fill="url(#bg)"/>

  <!-- embers drifting off the hot frame -->
  <g>
    <circle cx="150" cy="96"  r="2.2" fill="#fdba74" opacity="0.7"/>
    <circle cx="206" cy="108" r="1.8" fill="#fca5a5" opacity="0.55"/>
    <circle cx="124" cy="128" r="1.6" fill="#fde047" opacity="0.5"/>
    <circle cx="174" cy="70"  r="1.8" fill="#fca5a5" opacity="0.45"/>
    <circle cx="230" cy="58"  r="2.0" fill="#fdba74" opacity="0.5"/>
    <circle cx="100" cy="78"  r="1.4" fill="#fdba74" opacity="0.35"/>
  </g>

  <!-- heat bloom behind hottest frame -->
  <ellipse cx="182" cy="158" rx="90" ry="52" fill="url(#heat)"/>

  <!-- flame graph, fire-ramped by depth, hot path off-center -->
  <rect x="36"  y="300" width="408" height="34" fill="#7f1d1d"/>
  <rect x="36"  y="262" width="200" height="34" fill="#991b1b"/>
  <rect x="244" y="262" width="200" height="34" fill="#b91c1c"/>
  <rect x="36"  y="224" width="84"  height="34" fill="#b91c1c"/>
  <rect x="128" y="224" width="108" height="34" fill="#dc2626"/>
  <rect x="244" y="224" width="116" height="34" fill="#c2410c"/>
  <rect x="368" y="224" width="76"  height="34" fill="#9a3412"/>
  <rect x="128" y="186" width="108" height="34" fill="#ea580c"/>
  <rect x="244" y="186" width="74"  height="34" fill="#b45309"/>
  <rect x="138" y="144" width="88"  height="38" rx="3" fill="url(#hotbar)"/>

  <!-- the python program -->
  <rect x="44" y="306" width="34" height="22" rx="3" fill="#3776AB"/>
  <text x="61" y="321.5" font-size="12" font-weight="700" fill="#FFD43B" text-anchor="middle">py</text>

  <!-- hot frame extracted and rewritten in C++ -->
  <path d="M200 136 Q 240 70 284 66" fill="none" stroke="#fda4af" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ext)"/>
  <g transform="rotate(-4 340 74)">
    <rect x="296" y="58" width="88" height="32" rx="3" fill="#00599C" stroke="#66a9d8" stroke-width="1.5"/>
    <text x="340" y="79.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">C++</text>
  </g>
</svg>
