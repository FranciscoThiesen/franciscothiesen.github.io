<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#221040"/>
      <stop offset="100%" stop-color="#0d0620"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
    <linearGradient id="goldFade" gradientUnits="userSpaceOnUse" x1="0" y1="252" x2="0" y2="178">
      <stop offset="0%" stop-color="#f9a825" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f9a825" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f7ff"/>
      <stop offset="100%" stop-color="#4fc3f7"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#7df3ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7df3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="360" fill="url(#bg)"/>
  <ellipse cx="244" cy="184" rx="200" ry="150" fill="url(#halo)"/>

  <!-- stray JSON drifting by -->
  <g fill="#9d8fe0">
    <text x="44"  y="76"  font-size="14" opacity="0.16">"id": 7,</text>
    <text x="386" y="68"  font-size="13" opacity="0.13">[3.14,</text>
    <text x="36"  y="206" font-size="13" opacity="0.11">"pos":</text>
    <text x="412" y="176" font-size="14" opacity="0.13">true</text>
    <text x="48"  y="318" font-size="13" opacity="0.11">"x": 42,</text>
    <text x="396" y="314" font-size="14" opacity="0.14">}],</text>
    <text x="206" y="40"  font-size="13" opacity="0.11">"vec":</text>
  </g>

  <!-- speed streaks -->
  <g stroke-linecap="round">
    <line x1="6"  y1="104" x2="118" y2="104" stroke="#ffffff" stroke-width="2.5" opacity="0.16"/>
    <line x1="-10" y1="142" x2="92"  y2="142" stroke="#4fc3f7" stroke-width="2.5" opacity="0.3"/>
    <line x1="14" y1="182" x2="98"  y2="182" stroke="#ffffff" stroke-width="2" opacity="0.12"/>
    <line x1="-6" y1="222" x2="106" y2="222" stroke="#4fc3f7" stroke-width="2.5" opacity="0.26"/>
    <line x1="10" y1="262" x2="120" y2="262" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
    <line x1="368" y1="120" x2="486" y2="120" stroke="#4fc3f7" stroke-width="2.5" opacity="0.28"/>
    <line x1="390" y1="166" x2="482" y2="166" stroke="#ffffff" stroke-width="2" opacity="0.13"/>
    <line x1="376" y1="208" x2="490" y2="208" stroke="#ffffff" stroke-width="2.5" opacity="0.17"/>
    <line x1="394" y1="252" x2="478" y2="252" stroke="#4fc3f7" stroke-width="2.5" opacity="0.3"/>
  </g>

  <!-- glossy floor -->
  <line x1="86" y1="257" x2="394" y2="257" stroke="#7c6bd8" stroke-width="1" opacity="0.2"/>
  <ellipse cx="242" cy="258" rx="165" ry="7" fill="#4fc3f7" opacity="0.07"/>

  <!-- reflected braces (mirror about y=256) -->
  <g transform="translate(0,512) scale(1,-1)">
    <text x="150" y="244" font-size="180" font-weight="700" text-anchor="middle" fill="url(#goldFade)">{</text>
    <text x="334" y="244" font-size="180" font-weight="700" text-anchor="middle" fill="url(#goldFade)">}</text>
  </g>

  <!-- gold braces -->
  <text x="150" y="244" font-size="180" font-weight="700" text-anchor="middle" fill="none" stroke="#f9a825" stroke-width="9" opacity="0.28">{</text>
  <text x="150" y="244" font-size="180" font-weight="700" text-anchor="middle" fill="url(#gold)">{</text>
  <text x="334" y="244" font-size="180" font-weight="700" text-anchor="middle" fill="none" stroke="#f9a825" stroke-width="9" opacity="0.28">}</text>
  <text x="334" y="244" font-size="180" font-weight="700" text-anchor="middle" fill="url(#gold)">}</text>

  <!-- lightning bolt -->
  <polygon points="262,98 216,192 248,192 212,268 286,164 252,164 288,98" fill="none" stroke="#7df3ff" stroke-width="7" stroke-linejoin="round" opacity="0.35"/>
  <polygon points="262,98 216,192 248,192 212,268 286,164 252,164 288,98" fill="url(#bolt)"/>
</svg>
