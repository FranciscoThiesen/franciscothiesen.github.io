<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="Georgia,'Times New Roman',serif">
  <rect width="480" height="360" fill="#14101f"/>

  <!-- the paper -->
  <g transform="rotate(-1.6 240 180)">
    <rect x="40" y="38" width="416" height="304" fill="#000000" opacity="0.3"/>
    <rect x="32" y="28" width="416" height="304" fill="#faf7ef"/>

    <!-- figure title -->
    <text x="56" y="56" font-size="14.5" fill="#1f1f1f"><tspan font-weight="700">Figure 4.</tspan><tspan fill="#3a3a3a" font-style="italic">  Parsing throughput.</tspan></text>
    <text x="420" y="56" font-size="10.5" fill="#8f8779" font-family="ui-monospace,Menlo,monospace" text-anchor="end">P2996</text>

    <!-- gridlines + axis -->
    <g stroke="#ddd5c2" stroke-width="1">
      <line x1="68" y1="206" x2="420" y2="206"/>
      <line x1="68" y1="162" x2="420" y2="162"/>
      <line x1="68" y1="118" x2="420" y2="118"/>
      <line x1="68" y1="74"  x2="420" y2="74"/>
    </g>
    <g font-size="11" fill="#6f6855">
      <text x="60" y="210" text-anchor="end">2</text>
      <text x="60" y="166" text-anchor="end">4</text>
      <text x="60" y="122" text-anchor="end">6</text>
      <text x="60" y="78"  text-anchor="end">8</text>
    </g>
    <text x="56" y="92" font-size="10.5" fill="#6f6855" font-style="italic">GB/s</text>

    <!-- bars: serde 2.6, yyjson 3.4, ours 7.8 -->
    <rect x="100" y="192.8" width="60" height="57.2"  fill="#b9b1a3" stroke="#2b2b2b" stroke-width="1.25"/>
    <rect x="204" y="175.2" width="60" height="74.8"  fill="#8f8779" stroke="#2b2b2b" stroke-width="1.25"/>
    <rect x="308" y="78.4"  width="60" height="171.6" fill="#e8590c" stroke="#2b2b2b" stroke-width="1.25"/>

    <!-- error bars -->
    <g stroke="#2b2b2b" stroke-width="1.25">
      <line x1="130" y1="188" x2="130" y2="198"/><line x1="124" y1="188" x2="136" y2="188"/><line x1="124" y1="198" x2="136" y2="198"/>
      <line x1="234" y1="170" x2="234" y2="181"/><line x1="228" y1="170" x2="240" y2="170"/><line x1="228" y1="181" x2="240" y2="181"/>
      <line x1="338" y1="72"  x2="338" y2="85"/><line x1="332" y1="72"  x2="344" y2="72"/><line x1="332" y1="85"  x2="344" y2="85"/>
    </g>

    <!-- values -->
    <text x="130" y="180" font-size="13" fill="#2b2b2b" text-anchor="middle">2.6</text>
    <text x="234" y="162" font-size="13" fill="#2b2b2b" text-anchor="middle">3.4</text>
    <text x="338" y="62"  font-size="15" font-weight="700" fill="#e8590c" text-anchor="middle">7.8</text>

    <!-- baseline + labels -->
    <line x1="68" y1="250" x2="420" y2="250" stroke="#2b2b2b" stroke-width="1.5"/>
    <text x="130" y="270" font-size="12.5" fill="#3a3a3a" text-anchor="middle" font-style="italic">serde</text>
    <text x="234" y="270" font-size="12.5" fill="#3a3a3a" text-anchor="middle" font-style="italic">yyjson</text>
    <text x="338" y="270" font-size="12.5" font-weight="700" fill="#e8590c" text-anchor="middle">ours</text>

    <!-- caption text -->
    <rect x="56" y="290" width="318" height="4.5" fill="#d9d2bf"/>
    <rect x="56" y="302" width="356" height="4.5" fill="#d9d2bf"/>
    <rect x="56" y="314" width="208" height="4.5" fill="#d9d2bf"/>
  </g>
</svg>
