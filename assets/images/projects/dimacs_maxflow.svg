<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03101e"/>
      <stop offset="100%" stop-color="#0a2742"/>
    </linearGradient>
  </defs>

  <rect width="480" height="360" fill="url(#bg)"/>

  <!-- saturated pipes: glow + full bright water + core -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#38bdf8" stroke-opacity="0.2">
      <path d="M59 169 L151 101" stroke-width="25"/>
      <path d="M59 191 L151 259" stroke-width="22"/>
      <path d="M183 93 L287 112" stroke-width="25"/>
      <path d="M183 267 L287 248" stroke-width="22"/>
      <path d="M321 123 L419 172" stroke-width="27"/>
    </g>
    <g stroke="#38bdf8">
      <path d="M59 169 L151 101" stroke-width="15"/>
      <path d="M59 191 L151 259" stroke-width="12"/>
      <path d="M183 93 L287 112" stroke-width="15"/>
      <path d="M183 267 L287 248" stroke-width="12"/>
      <path d="M321 123 L419 172" stroke-width="17"/>
    </g>
    <g stroke="#b5f1ff" stroke-width="2.5" stroke-opacity="0.8">
      <path d="M59 169 L151 101"/>
      <path d="M59 191 L151 259"/>
      <path d="M183 93 L287 112"/>
      <path d="M183 267 L287 248"/>
      <path d="M321 123 L419 172"/>
    </g>
  </g>

  <!-- unsaturated pipes: dark casing sized by capacity, partial water fill -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#16344d">
      <path d="M63 180 L147 180" stroke-width="12"/>
      <path d="M181 172 L289 123" stroke-width="10"/>
      <path d="M181 188 L289 237" stroke-width="9"/>
      <path d="M321 237 L419 188" stroke-width="18"/>
    </g>
    <g stroke="#1d83bd">
      <path d="M63 180 L147 180" stroke-width="6"/>
      <path d="M181 172 L289 123" stroke-width="3.5"/>
      <path d="M181 188 L289 237" stroke-width="4.5"/>
      <path d="M321 237 L419 188" stroke-width="13"/>
    </g>
  </g>

  <!-- junctions -->
  <g stroke-width="2.5">
    <circle cx="165" cy="90"  r="15" fill="#0a1f33" stroke="#2e5e80"/>
    <circle cx="165" cy="180" r="15" fill="#0a1f33" stroke="#2e5e80"/>
    <circle cx="165" cy="270" r="15" fill="#0a1f33" stroke="#2e5e80"/>
    <circle cx="305" cy="115" r="15" fill="#0a1f33" stroke="#2e5e80"/>
    <circle cx="305" cy="245" r="15" fill="#0a1f33" stroke="#2e5e80"/>
    <circle cx="45"  cy="180" r="16" fill="#0a2e22" stroke="#34d399"/>
    <circle cx="435" cy="180" r="16" fill="#2e0a12" stroke="#fb7185"/>
  </g>
  <text x="45" y="185.5" font-size="15" font-weight="700" fill="#6ee7b7" text-anchor="middle">s</text>
  <text x="435" y="185.5" font-size="15" font-weight="700" fill="#fda4af" text-anchor="middle">t</text>
</svg>
