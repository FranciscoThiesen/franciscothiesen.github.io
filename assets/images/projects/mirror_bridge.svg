<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171c30"/>
      <stop offset="100%" stop-color="#0c0f1c"/>
    </linearGradient>
  </defs>

  <rect width="480" height="360" fill="url(#bg)"/>

  <!-- the C++ you write -->
  <text x="40" y="56" font-size="13" fill="#6272a4">// mesh.hpp</text>
  <text x="40" y="88" font-size="17"><tspan fill="#ff79c6">struct</tspan><tspan fill="#f8f8f2"> Mesh {</tspan></text>
  <text x="62" y="118" font-size="17"><tspan fill="#8be9fd">vec3</tspan><tspan fill="#f8f8f2"> </tspan><tspan fill="#50fa7b">centroid</tspan><tspan fill="#f8f8f2">();</tspan></text>
  <text x="62" y="148" font-size="17"><tspan fill="#ff79c6">void</tspan><tspan fill="#f8f8f2"> </tspan><tspan fill="#50fa7b">fit</tspan><tspan fill="#f8f8f2">(</tspan><tspan fill="#8be9fd">float</tspan><tspan fill="#f8f8f2"> eps);</tspan></text>
  <text x="40" y="178" font-size="17" fill="#f8f8f2">};</text>

  <!-- the one call that does everything -->
  <rect x="32" y="226" width="226" height="34" rx="5" fill="#50fa7b" fill-opacity="0.08" stroke="#50fa7b" stroke-opacity="0.35"/>
  <text x="44" y="249" font-size="17"><tspan fill="#50fa7b">bind_class</tspan><tspan fill="#f8f8f2">&lt;</tspan><tspan fill="#8be9fd">Mesh</tspan><tspan fill="#f8f8f2">&gt;(m);</tspan></text>

  <!-- fan-out to the three runtimes -->
  <g fill="none" stroke="#6272a4" stroke-width="1.5" opacity="0.55">
    <path d="M260 240 C 282 240, 268 92, 290 92"/>
    <path d="M260 243 C 278 243, 272 172, 290 172"/>
    <path d="M260 246 C 276 246, 276 252, 290 252"/>
  </g>

  <!-- python -->
  <circle cx="298" cy="91" r="5" fill="#3776AB"/>
  <text x="310" y="78" font-size="11" fill="#5b9bd5">python</text>
  <text x="310" y="97" font-size="15.5"><tspan fill="#5b9bd5">&gt;&gt;&gt;</tspan><tspan fill="#f8f8f2"> m.fit(1e-3)</tspan></text>

  <!-- lua -->
  <circle cx="298" cy="171" r="5" fill="#6b6bd6"/>
  <text x="310" y="158" font-size="11" fill="#8a8ae6">lua</text>
  <text x="310" y="177" font-size="15.5"><tspan fill="#8a8ae6">&gt;</tspan><tspan fill="#f8f8f2"> m:fit(1e-3)</tspan></text>

  <!-- javascript -->
  <circle cx="298" cy="251" r="5" fill="#F7DF1E"/>
  <text x="310" y="238" font-size="11" fill="#e8d44d">node</text>
  <text x="310" y="257" font-size="15.5"><tspan fill="#e8d44d">&gt;</tspan><tspan fill="#f8f8f2"> m.fit(1e-3)</tspan></text>

  <!-- compile-time, no glue -->
  <text x="40" y="322" font-size="13" fill="#6272a4">// zero glue code — P2996 reflection fills in the rest</text>
</svg>
