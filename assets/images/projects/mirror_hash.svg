<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07211c"/>
      <stop offset="100%" stop-color="#0d3328"/>
    </linearGradient>
    <radialGradient id="gMint">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
