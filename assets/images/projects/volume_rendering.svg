<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="480" height="360" fill="#00090f"/>

  <!-- scanlines -->
  <g stroke="#07212f" stroke-width="1">
    <line x1="0" y1="24"  x2="480" y2="24"/><line x1="0" y1="48"  x2="480" y2="48"/>
    <line x1="0" y1="72"  x2="480" y2="72"/><line x1="0" y1="96"  x2="480" y2="96"/>
    <line x1="0" y1="120" x2="480" y2="120"/><line x1="0" y1="144" x2="480" y2="144"/>
    <line x1="0" y1="168" x2="480" y2="168"/><line x1="0" y1="192" x2="480" y2="192"/>
    <line x1="0" y1="216" x2="480" y2="216"/><line x1="0" y1="240" x2="480" y2="240"/>
    <line x1="0" y1="264" x2="480" y2="264"/><line x1="0" y1="288" x2="480" y2="288"/>
    <line x1="0" y1="312" x2="480" y2="312"/><line x1="0" y1="336" x2="480" y2="336"/>
  </g>

  <!-- sweeping scan band -->
  <rect x="288" y="0" width="26" height="360" fill="url(#band)"/>
  <line x1="301" y1="0" x2="301" y2="360" stroke="#67e8f9" stroke-width="1.5" opacity="0.4"/>

  <!-- integration rays with adaptive samples -->
  <g stroke="#7dd3fc" stroke-width="1" opacity="0.25">
    <line x1="30" y1="150" x2="450" y2="150" stroke-dasharray="3 9"/>
    <line x1="30" y1="215" x2="450" y2="215" stroke-dasharray="3 9"/>
  </g>

  <!-- CT head -->
  <path d="M324 100 C 295 63, 237 56, 203 79 C 187 90, 180 113, 182 134 C 183 148, 178 155, 173 169 L 159 194 C 157 198, 161 203, 168 203 C 166 212, 166 219, 173 221 C 168 228, 168 238, 178 240 C 173 249, 175 263, 189 267 C 203 286, 228 300, 258 302 C 295 304, 327 286, 341 249 C 357 203, 352 134, 324 100 Z"
        fill="#0d3340" fill-opacity="0.4" stroke="#22d3ee" stroke-width="8" stroke-opacity="0.14"/>
  <path d="M324 100 C 295 63, 237 56, 203 79 C 187 90, 180 113, 182 134 C 183 148, 178 155, 173 169 L 159 194 C 157 198, 161 203, 168 203 C 166 212, 166 219, 173 221 C 168 228, 168 238, 178 240 C 173 249, 175 263, 189 267 C 203 286, 228 300, 258 302 C 295 304, 327 286, 341 249 C 357 203, 352 134, 324 100 Z"
        fill="none" stroke="#9be8ff" stroke-width="2.5"/>
  <ellipse cx="263" cy="157" rx="62" ry="48" fill="none" stroke="#4dd0e1" stroke-opacity="0.4" stroke-width="1.5"/>
  <ellipse cx="263" cy="157" rx="39" ry="30" fill="none" stroke="#4dd0e1" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- samples: dense inside the volume, sparse outside -->
  <g fill="#3a6a8a">
    <circle cx="40" cy="150" r="1.4"/><circle cx="76" cy="150" r="1.4"/><circle cx="112" cy="150" r="1.4"/><circle cx="148" cy="150" r="1.4"/>
    <circle cx="380" cy="150" r="1.4"/><circle cx="414" cy="150" r="1.4"/><circle cx="448" cy="150" r="1.4"/>
    <circle cx="40" cy="215" r="1.4"/><circle cx="76" cy="215" r="1.4"/><circle cx="112" cy="215" r="1.4"/><circle cx="148" cy="215" r="1.4"/>
    <circle cx="372" cy="215" r="1.4"/><circle cx="406" cy="215" r="1.4"/><circle cx="440" cy="215" r="1.4"/>
  </g>
  <g fill="#e0f7ff">
    <circle cx="190" cy="150" r="2.2"/><circle cx="207" cy="150" r="2.2"/><circle cx="224" cy="150" r="2.2"/><circle cx="241" cy="150" r="2.2"/><circle cx="258" cy="150" r="2.2"/><circle cx="275" cy="150" r="2.2"/><circle cx="292" cy="150" r="2.2"/><circle cx="309" cy="150" r="2.2"/><circle cx="326" cy="150" r="2.2"/><circle cx="343" cy="150" r="2.2"/>
    <circle cx="175" cy="215" r="2.2"/><circle cx="192" cy="215" r="2.2"/><circle cx="209" cy="215" r="2.2"/><circle cx="226" cy="215" r="2.2"/><circle cx="243" cy="215" r="2.2"/><circle cx="260" cy="215" r="2.2"/><circle cx="277" cy="215" r="2.2"/><circle cx="294" cy="215" r="2.2"/><circle cx="311" cy="215" r="2.2"/><circle cx="328" cy="215" r="2.2"/><circle cx="345" cy="215" r="2.2"/>
  </g>

  <!-- viewer chrome: crop marks + axis ticks -->
  <g fill="none" stroke="#2b5d8a" stroke-width="2">
    <path d="M14 36 V14 H36"/>
    <path d="M444 14 H466 V36"/>
    <path d="M466 324 V346 H444"/>
    <path d="M36 346 H14 V324"/>
  </g>
  <g stroke="#2b5d8a" stroke-width="1.5">
    <line x1="240" y1="10" x2="240" y2="22"/><line x1="234" y1="16" x2="246" y2="16"/>
    <line x1="240" y1="338" x2="240" y2="350"/><line x1="234" y1="344" x2="246" y2="344"/>
    <line x1="10" y1="180" x2="22" y2="180"/><line x1="16" y1="174" x2="16" y2="186"/>
    <line x1="458" y1="180" x2="470" y2="180"/><line x1="464" y1="174" x2="464" y2="186"/>
  </g>
</svg>
