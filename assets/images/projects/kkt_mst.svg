  <text x="240" y="326" font-size="12.5" fill="#737373" text-anchor="middle">sample → verify (Hagerup) → recurse · E[T] = O(m)</text>

  <rect x="0.5" y="0.5" width="479" height="359" rx="9.5" fill="none" stroke="#262626"/>
